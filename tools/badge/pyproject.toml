[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sycl-badge-tool"
version = "0.1.0"
description = "Host tool for SYCL badges: list, console, monitor, flash, install, multiplayer lobby"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.4"]

[project.scripts]
badge = "badge.cli:main"

[tool.setuptools]
packages = ["badge"]
